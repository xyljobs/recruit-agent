name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate (tsc + eslint)
        run: pnpm validate

      - name: Unit tests
        run: pnpm test:unit

      - name: Database integration tests (temporary PostgreSQL via docker compose)
        run: pnpm test:db

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Python worker tests
        working-directory: assets
        run: uv run --locked python -m unittest discover -s tests -v
