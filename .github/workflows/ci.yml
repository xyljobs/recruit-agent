name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: TypeScript + ESLint + 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查 + Lint
        run: pnpm validate

      - name: 单元测试
        run: pnpm test:unit

  worker-tests:
    name: Python Worker 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Worker 单元测试
        working-directory: assets
        run: uv run python -m unittest discover -s tests -v
