services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zhipin_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${TEST_DATABASE_PORT:-55432}:5432"
    volumes:
      - ./scripts/test-db-init.sql:/docker-entrypoint-initdb.d/001-test-init.sql:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zhipin_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    restart: "no"
