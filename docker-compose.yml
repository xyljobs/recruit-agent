services:
  app:
    image: zhipin-agent:local
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    environment:
      # 子路径部署（共享域名下的 /zhaopin 等）；为空时根路径部署
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
      # 容器内访问宿主机 Supabase 必须用 host.docker.internal（extra_hosts 已映射到
      # docker0 网关 172.17.0.1，绕开 Docker Desktop 转发链路）；不要复用 .env.local
      # 中的 SUPABASE_URL（那是宿主机视角的 localhost，容器内指向自身会连接失败）。
      SUPABASE_URL: ${ZHIPIN_SUPABASE_URL:-http://host.docker.internal:8000}
      SUPABASE_ANON_KEY_FILE: /run/secrets/SUPABASE_ANON_KEY
      SUPABASE_SERVICE_ROLE_KEY_FILE: /run/secrets/SUPABASE_SERVICE_ROLE_KEY
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_API_KEY_FILE: /run/secrets/LLM_API_KEY
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
      AI_EXECUTION_MODE: ${AI_EXECUTION_MODE:-rules_only}
      PRIVATE_LLM_BASE_URL: ${PRIVATE_LLM_BASE_URL:-}
      APPROVED_CLOUD_LLM_BASE_URL: ${APPROVED_CLOUD_LLM_BASE_URL:-}
      APPROVED_CLOUD_PROCESSORS: ${APPROVED_CLOUD_PROCESSORS:-}
      AI_PRIVATE_ENDPOINT_CONFIRMED: ${AI_PRIVATE_ENDPOINT_CONFIRMED:-false}
      ENCRYPTION_KEY_FILE: /run/secrets/ENCRYPTION_KEY
      HMAC_KEY_FILE: /run/secrets/HMAC_KEY
      JWT_SECRET_FILE: /run/secrets/JWT_SECRET
      SUPABASE_JWT_SECRET_FILE: /run/secrets/SUPABASE_JWT_SECRET
      APP_URL: ${APP_URL:?APP_URL is required}
      ALLOW_EXTERNAL_RESUME_ANALYSIS: ${ALLOW_EXTERNAL_RESUME_ANALYSIS:-false}
      ALLOW_EXTERNAL_RESUME_BATCH_ANALYSIS: ${ALLOW_EXTERNAL_RESUME_BATCH_ANALYSIS:-false}
      CANDIDATE_REPORT_MODE: ${CANDIDATE_REPORT_MODE:-local}
      RESUME_VL_MODEL: ${RESUME_VL_MODEL:-qwen-vl-max}
      BOSS_RESUME_DIR: ${BOSS_RESUME_DIR:-}
    secrets:
      - SUPABASE_ANON_KEY
      - SUPABASE_SERVICE_ROLE_KEY
      - LLM_API_KEY
      - ENCRYPTION_KEY
      - HMAC_KEY
      - JWT_SECRET
      - SUPABASE_JWT_SECRET
    ports:
      - "${PORT:-5000}:5000"
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
    restart: unless-stopped
  match-worker:
    image: zhipin-agent:local
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    command: ["node", "dist-workers/match-batch-worker.js"]
    environment:
      SUPABASE_URL: ${ZHIPIN_SUPABASE_URL:-http://host.docker.internal:8000}
      SUPABASE_ANON_KEY_FILE: /run/secrets/SUPABASE_ANON_KEY
      SUPABASE_SERVICE_ROLE_KEY_FILE: /run/secrets/SUPABASE_SERVICE_ROLE_KEY
      ENCRYPTION_KEY_FILE: /run/secrets/ENCRYPTION_KEY
    secrets:
      - SUPABASE_ANON_KEY
      - SUPABASE_SERVICE_ROLE_KEY
      - ENCRYPTION_KEY
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
    restart: unless-stopped
  integration-worker:
    image: zhipin-agent:local
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    command: ["node", "dist-workers/integration-outbox-worker.js"]
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_ANON_KEY_FILE: /run/secrets/SUPABASE_ANON_KEY
      SUPABASE_SERVICE_ROLE_KEY_FILE: /run/secrets/SUPABASE_SERVICE_ROLE_KEY
      ENCRYPTION_KEY_FILE: /run/secrets/ENCRYPTION_KEY
      INTEGRATION_OUTBOUND_ALLOWED_HOSTS: ${INTEGRATION_OUTBOUND_ALLOWED_HOSTS:-}
    secrets:
      - SUPABASE_ANON_KEY
      - SUPABASE_SERVICE_ROLE_KEY
      - ENCRYPTION_KEY
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
    restart: unless-stopped

secrets:
  SUPABASE_ANON_KEY:
    file: ${DOCKER_SECRETS_DIR:-./secrets}/SUPABASE_ANON_KEY
  SUPABASE_SERVICE_ROLE_KEY:
    file: ${DOCKER_SECRETS_DIR:-./secrets}/SUPABASE_SERVICE_ROLE_KEY
  LLM_API_KEY:
    file: ${DOCKER_SECRETS_DIR:-./secrets}/LLM_API_KEY
  ENCRYPTION_KEY:
    file: ${DOCKER_SECRETS_DIR:-./secrets}/ENCRYPTION_KEY
  HMAC_KEY:
    file: ${DOCKER_SECRETS_DIR:-./secrets}/HMAC_KEY
  JWT_SECRET:
    file: ${DOCKER_SECRETS_DIR:-./secrets}/JWT_SECRET
  SUPABASE_JWT_SECRET:
    file: ${DOCKER_SECRETS_DIR:-./secrets}/SUPABASE_JWT_SECRET
