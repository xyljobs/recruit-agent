services:
  studio:
    image: ghcr.io/supabase/studio:2026.07.07-sha-a6a04f2
  kong:
    image: public.ecr.aws/docker/library/kong:3.9.1
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed 's#/entrypoint.sh kong docker-start#/docker-entrypoint.sh kong docker-start#' /home/kong/kong-entrypoint.sh > /tmp/kong-entrypoint.sh
        exec /bin/sh /tmp/kong-entrypoint.sh
    ports: !override
      - "127.0.0.1:${KONG_HTTP_PORT}:8000/tcp"
      - "127.0.0.1:${KONG_HTTPS_PORT}:8443/tcp"
  auth:
    image: ghcr.io/supabase/gotrue:v2.189.0
  rest:
    image: ghcr.io/supabase/postgrest:v14.12
  realtime:
    image: ghcr.io/supabase/realtime:v2.102.3
  storage:
    image: ghcr.io/supabase/storage-api:v1.60.4
  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v3.30.1
  meta:
    image: ghcr.io/supabase/postgres-meta:v0.96.6
  functions:
    image: ghcr.io/supabase/edge-runtime:v1.74.0
  db:
    image: ghcr.io/supabase/postgres:17.6.1.136
  supavisor:
    image: ghcr.io/supabase/supavisor:2.9.5
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT}:5432/tcp"
      - "127.0.0.1:${POOLER_PROXY_PORT_TRANSACTION}:6543/tcp"
